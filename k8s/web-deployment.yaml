apiVersion: apps/v1
kind: Deployment
metadata: { name: notes-web }
spec:
  replicas: 1
  selector: { matchLabels: { app: notes-web } }
  template:
    metadata: { labels: { app: notes-web } }
    spec:
      containers:
        - name: web
          image: docker.io/<username>/notes-web:latest
          ports: [{ containerPort: 80 }]
          env:
            - name: VITE_API_URL
              value: "http://notes-api:5000"
---
apiVersion: v1
kind: Service
metadata: { name: notes-web }
spec:
  selector: { app: notes-web }
  ports: [{ port: 80, targetPort: 80 }]
  type: NodePort
